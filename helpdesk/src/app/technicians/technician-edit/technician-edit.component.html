<div class="panel panel-default">
  <div class="panel-body">
    <form id="technician-edit" #f="ngForm" (ngSubmit)="onSubmit(f)">
      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" class="form-control required" [ngModel]=technician?.name #name="ngModel"
            required size="120" max="120">
        </div>
      </div>
      <div *ngIf="!name.valid && name.touched" class="row" style="margin-left: 10px; color: rgb(218, 19, 19);">
        <p>Enter the technician's name.</p>
      </div>

      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" class="form-control required" [ngModel]=technician?.email #email="ngModel"
            required pattern="^[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,3}$" size="120" max="255">
        </div>
      </div>
      <div *ngIf="!email.valid && email.touched" class="row" style="margin-left: 10px; color: rgb(218, 19, 19);">
        <p>Enter a valid email address.</p>
      </div>

      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="phone">Phone:</label>
          <input type="text" id="phone" name="phone" class="form-control invalid" [ngModel]=technician?.phone #phone="ngModel"
            pattern="\D*([2-9]\d{2})(\D*)([2-9]\d{2})(\D*)(\d{4})\D*" size="150" max="255">

        </div>
      </div>
      <div *ngIf="!phone.valid && phone.touched" class="row" style="margin-left: 10px; color: rgb(218, 19, 19);">
        <p>Enter a valid phone number.</p>
      </div>

      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="imageUrl">Image URL:</label>
          <input type="text" id="imageUrl" name="imageUrl" class="form-control" [ngModel]=technician?.imageUrl
            #imageUrl="ngModel" size="150" max="255">
        </div>
      </div>
      <div *ngIf="(!name.valid && name.touched) || (!email.valid && email.touched)" class="row">
        <p class="alert alert-danger">The name and email fields are required.</p>
      </div>

      <div class="row">
        <div class="col-xs-12 btn-toolbar">
          <button [disabled]="!f.valid" class="btn btn-success" type="submit">Save</button>
          <button class="btn btn-primary" type="button" (click)="onCancel()">Cancel</button>
        </div>
      </div>

    </form>
  </div>
</div>
