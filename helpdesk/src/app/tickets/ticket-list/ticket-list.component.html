<div class="row">
  <div class="col-xs-12">
    <div class="panel panel-default">
      <div class="panel-heading">
        <div class="row pad-left-right">
          <span class="title pull-left">Service Requests</span>
          <div class="col-xs-4 text-right">
            <a class="btn btn-success" [routerLink]="['new']">New Service Request</a>
          </div>
        </div>
      </div>
      <div class="panel-body">
        <div class="row">
          <div class="col-xs-12">
            <hds-ticket-item *ngFor="let ticketEl of tickets" [ticket]="ticketEl">
            </hds-ticket-item>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
