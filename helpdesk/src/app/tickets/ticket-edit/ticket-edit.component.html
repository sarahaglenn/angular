<div class="container mt-4">
  <h2>Submit Service Request</h2>
  <hr>

  <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label for="title" class="form-label">Issue Title</label>
      <input type="text" id="title" formControlName="title" class="form-control"
        placeholder="e.g., Printer Jammed or Screen Cracked">
    </div>

    <div class="mb-3">
      <label for="device" class="form-label">Affected Device</label>
      <select id="device" formControlName="device" class="form-select">
        <option value="" disabled>-- Select a Device from Inventory --</option>

        <option *ngFor="let dev of devices" [value]="dev._id">
          {{ dev.name }} ({{ dev.status }})
        </option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Priority Level</label>
      <div class="d-flex gap-3">
        <div class="form-check" *ngFor="let p of PriorityLevels | keyvalue">
          <input class="form-check-input" type="radio" [value]="p.value" formControlName="priority" [id]="p.key">
          <label class="form-check-label" [for]="p.key">
            {{ p.value }}
          </label>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col">
        <label class="form-label text-muted">Reported By</label>
        <input type="text" [value]="submittedBy" class="form-control" readonly>
      </div>
      <div class="col">
        <label class="form-label text-muted">Date Generated</label>
        <input type="text" [value]="today | date:'medium'" class="form-control" readonly>
      </div>
    </div>
    
    if editMode
    <div class="mb-3">
      <label for="status" class="form-label">Ticket Status</label>
      <select id="status" formControlName="status" class="form-select">
        <option *ngFor="let stat of statusValues | keyvalue" [value]="stat.value">
          {{ stat.value }}
        </option>
      </select>
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-primary me-2" [disabled]="ticketForm.invalid">
        Submit Ticket
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="onClear()">
        Clear Form
      </button>
    </div>

  </form>
</div>
