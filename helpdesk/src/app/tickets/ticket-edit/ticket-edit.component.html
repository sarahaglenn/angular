<div class="panel panel-default shadow-sm">
  <div class="panel-heading">
    <h3 class="panel-title" style="font-weight: bold;">
      {{ editMode ? 'Edit' : 'New' }} Service Request
    </h3>
  </div>

  <div class="panel-body" style="padding: 20px;">
    <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()">

      <div class="form-group" [class.has-error]="ticketForm.get('title')?.invalid && ticketForm.get('title')?.touched">
        <label class="control-label small text-uppercase">Issue Title</label>
        <input type="text" class="form-control" formControlName="title" placeholder="Summary of the problem">
        <span class="help-block" *ngIf="ticketForm.get('title')?.invalid && ticketForm.get('title')?.touched">
          Please provide a short title for this issue.
        </span>
      </div>

      <div class="form-group"
        [class.has-error]="ticketForm.get('issueDescription')?.invalid && ticketForm.get('issueDescription')?.touched">
        <label class="control-label small text-uppercase">Description</label>
        <textarea class="form-control" formControlName="issueDescription" rows="4"
          placeholder="Detail the issue..."></textarea>
        <span class="help-block"
          *ngIf="ticketForm.get('issueDescription')?.invalid && ticketForm.get('issueDescription')?.touched">
          A description is required so the tech knows what to look for.
        </span>
      </div>

      <div class="row">
        <div class="col-sm-6">
          <div class="form-group">
            <label class="control-label small text-uppercase">Status</label>
            <select formControlName="status" class="form-control">
              <option *ngFor="let stat of orderedStatuses" [value]="stat">{{ stat }}</option>
            </select>
          </div>
        </div>
        <div class="col-sm-6">
          <div class="form-group"
            [class.has-error]="ticketForm.get('device')?.invalid && ticketForm.get('device')?.touched">
            <label class="control-label small text-uppercase">Affected Device</label>
            <select formControlName="device" class="form-control">
              <option value="" disabled>-- Select Device --</option>
              <option *ngFor="let dev of devices" [value]="dev._id">{{ dev.name }}</option>
            </select>
            <span class="help-block" *ngIf="ticketForm.get('device')?.invalid && ticketForm.get('device')?.touched">
              Select a device.
            </span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="control-label small text-uppercase" style="display: block;">Priority Level</label>
        <div style="padding-top: 5px;">
          <label class="radio-inline" *ngFor="let p of orderedPriorities">
            <input type="radio" [value]="p" formControlName="priority"> {{ p }}
          </label>
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <div class="form-group">
        <label class="control-label small text-uppercase">Assigned Technician</label>
        <select formControlName="assignedTechnician" class="form-control">
          <option value="">-- Unassigned --</option>
          <option *ngFor="let tech of technicians" [value]="tech._id">{{ tech.name }}</option>
        </select>
      </div>

      <div class="well well-sm" style="margin-bottom: 20px; background-color: #fcfcfc;">
        <div class="row">
          <div class="col-xs-6">
            <label class="text-muted small fw-bold text-uppercase" style="font-size: 10px;">Reported By</label>
            <p class="form-control-static" style="padding-top: 0; padding-bottom: 0;">{{ submittedBy }}</p>
          </div>
          <div class="col-xs-6">
            <label class="text-muted small fw-bold text-uppercase" style="font-size: 10px;">Date Created</label>
            <p class="form-control-static" style="padding-top: 0; padding-bottom: 0;">{{ today | date:'short' }}</p>
          </div>
        </div>
      </div>

      <div class="clearfix">
        <button type="submit" class="btn btn-success pull-left" [disabled]="ticketForm.invalid"
          style="min-width: 120px;">
          <span></span> Save Ticket
        </button>
        <button type="button" class="btn btn-danger pull-right" (click)="onClear()">
          Clear
        </button>
      </div>

    </form>
  </div>
</div>
